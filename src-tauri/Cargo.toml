[package]
name = "secdel"
version = "1.0.0"
description = "SecDel - Advanced SSD Secure Deletion Platform"
authors = ["Shaik Abdul Razak"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "secdel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# Secure random
rand = "0.8"

# Windows APIs
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Console",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_System_Memory",
  "Win32_System_Wmi",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Storage_DistributedFileSystem",
  "Win32_System_Threading",
  "Win32_System_SystemServices",
  "Win32_System_Com",
  "Win32_System_Com_CallObj",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Registry",
  "Win32_System_ProcessStatus",
  "Win32_System_Kernel",
  "Win32_System_Pipes",
  "Win32_Storage_Nvme",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Chrono for timestamps
chrono = { version = "0.4", features = ["serde"] }

# PDF generation
printpdf = "0.7"

# CSV
csv = "1.3"

# UUID
uuid = { version = "1", features = ["v4"] }

# Byte manipulation
byteorder = "1"
bytes = "1"

# Base64 encoding
base64 = "0.22"

# Hex encoding
hex = "0.4"

# Crc for checksums
crc32fast = "1"

# Glob patterns for file matching
glob = "0.3"
ignore = "0.4"

# SHA256 for hashing
sha2 = "0.10"

# Scoped threads
scoped_threadpool = "0.1"

# Serialization
bincode = "1"
toml = "0.8"

# File watching
notify = "8"

# Temp files
tempfile = "3"

# Memmap2 for direct memory access
memmap2 = "0.9"

# Zeroize for secure memory clearing
zeroize = { version = "1", features = ["zeroize_derive"] }
